<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribute Page</title> 
    <style>
        #main{
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #title{
            font-size: 2.5rem;
            margin-bottom: 0;
        }
        #tribute-info{
            font-size: 1.5rem;
            margin-top: 0;
            font-style: italic;
        }
        #img-div{
            margin: 20px auto;
            max-width: 80%;
        }
        #image{
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #img-caption{
            font-size: 1rem;
            margin-top: 10px;
        }
        .tribute-info{
            margin-top: 20px;
        }
        #tribute-link{
            font-size: 1.2rem;
            color: blue;
            text-decoration: none;
        }
        #tribute-link:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main id="main">
        <h1 id="title">Dr. Norman Borlaug</h1>
        <p id="tribute-info">The man who saved a billion lives</p>
       
        <figure id="img-div">
             <img id="image" src="https://cdn.freecodecamp.org/testable-projects-fcc/images/tribute-page-main-image.jpg" alt="Dr. Norman Borlaug seen standing in Mexican wheat field with a group of biologists">
            <figcaption id="img-caption">Dr. Norman Borlaug, third from the left, trains biologists in Mexico on how to increase wheat yields - part of his life-long war on hunger.</figcaption>
        </figure>
        <div class="tribute-info">
            <a href="https://en.wikipedia.org/wiki/Norman_Borlaug" id="tribute-link" target="_blank">Tribute</a>
        </div>
       
    </main>
</body>
</html>
