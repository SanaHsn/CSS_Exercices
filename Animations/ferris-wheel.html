<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ferris Wheel</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .wheel {
        border: 2px solid black;
        border-radius: 50%;
        position: absolute;

        top: 50%;
        left: 50%;

        height: 55vw;
        width: 55vw;
        max-width: 500px;
        max-height: 500px;

        animation-name: wheel;
        animation-duration: 10s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }


      .line {
        background-color: black;
        width: 50%;
        height: 2px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform-origin: 0% 0%;
      }

      .line:nth-of-type(2) {
        transform: rotate(60deg);
      }
      .line:nth-of-type(3) {
        transform: rotate(120deg);
      }
      .line:nth-of-type(4) {
        transform: rotate(180deg);
      }
      .line:nth-of-type(5) {
        transform: rotate(240deg);
      }
      .line:nth-of-type(6) {
        transform: rotate(300deg);
      }

      .cabin {
        background-color: rgb(0, 60, 255);
        width: 20%;
        height: 20%;
        position: absolute;
        border: 2px solid;
        transform-origin: 50% 0%;
        animation: cabins 10s ease-in-out infinite;
      }

      .cabin:nth-of-type(1) {
        right: -8.5%;
        top: 50%;
      }
      .cabin:nth-of-type(2) {
        right: 17%;
        top: 93.5%;
      }
      .cabin:nth-of-type(3) {
        right: 67%;
        top: 93.5%;
      }
      .cabin:nth-of-type(4) {
        left: -8.5%;
        top: 50%;
      }
      .cabin:nth-of-type(5) {
        left: 17%;
        top: 7%;
      }
      .cabin:nth-of-type(6) {
        right: 17%;
        top: 7%;
      }
      /* Pour center la roue, on utilise position: absolute; avec top: 50%; et left: 50%;. Cependant, cela place le coin supérieur gauche de la roue au centre de la page. Pour corriger cela, on utilise transform: translate(-50%, -50%); qui déplace la roue de moitié de sa largeur vers la gauche et de moitié de sa hauteur vers le haut, alignant ainsi son centre avec le centre de la page. */

      /* Mais si on utilise des animations on peut pas utiliser transform: translate(-50%, -50%); sur la roue, car cela affecterait l'animation de rotation. Donc on utilise transform: translate(-50%, -50%) dans les keyframes pour centrer la roue pendant l'animation. */

      @keyframes wheel {
        0% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        100% {
          transform: translate(-50%, -50%)  rotate(360deg);
        }
       
      }

      @keyframes cabins {
        0% {
          transform: rotate(0deg);
        }
        25% {
          background-color: yellow;
        }
        50% {
          background-color: purple;
        }
        75% {
          background-color: yellow;
        }
        100% {
          transform: rotate(-360deg);
        }
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center; margin-top: 20px; font-family: Arial, sans-serif;"> Ferris Wheel Animation</h1>
    <div class="wheel">
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>

      <div class="cabin"></div>
      <div class="cabin"></div>
      <div class="cabin"></div>
      <div class="cabin"></div>
      <div class="cabin"></div>
      <div class="cabin"></div>
    </div>
  </body>
</html>
