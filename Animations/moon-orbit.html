<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a Moon Orbit</title>
    <style>
        body{
             margin: 0;
             padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        .space{ 
            width: 200px;
            height: 200px;
            position:relative;
            background-color: red;
        }
        .earth{
            width: 100px;
            height: 100px;
            position :absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* to center the earth in the main container */
            background-color: blue;
            border-radius: 50%;
        } 
        .orbit{
            width: 200px;
            height: 200px;
            position :absolute;
            top: 50%;
            left: 50%;
            /* background-color: green; */
            animation: orbit 5s linear infinite; /* animation to make the moon orbit around the earth */
        }
        .moon{
             width: 30px;
            height: 30px;
            position :absolute;
            top: 0;
            left: 50%;
            background-color: gray;
            border-radius: 50%;
            transform: translateX(-50%) translateY(-50%); /* to position the moon at the edge of the orbit */
            
        }
        @keyframes orbit {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
        
    </style>
</head>
<body>
    <div class="space">
        <div class="earth"></div>
        <div class="orbit">
            <div class="moon"></div>
        </div>
    </div>
</body>
</html>
