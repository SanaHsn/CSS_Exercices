<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="Business_Card.css" /> -->
    <title>Business Card</title>
  </head>
  <style>
    body {
      background-color: rosybrown;
      font-family: Arial, sans-serif;
    }
    .business-card {
      width: 300px;
      background-color: lavenderblush;
      padding: 20px;
      margin: 100px;
      text-align: center;
      font-size: 16px;
      margin-left: auto;
      margin-right: auto;
    }
    .profile-image {
      max-width: 100%;
    }
    p {
      margin-top: 5px;
      margin-bottom: 5px;
    }
    a {
      text-decoration: none;
    }
  </style>
  <body>
    <div class="business-card">
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
        alt="fleur tournesol rose"
        class="profile-image"
      />
      <p class="full-name">Hasnaoui Sanae</p>
      <p class="designation">Software Developer</p>
      <p class="company">@freeCodeCamp</p>
      <hr />

      <p>sanae.hasnaoui.dev@gmail.com</p>
      <p>+324 83 88 9119</p>
      <a href="https://www.linkedin.com/feed/" class="portfolio-link"
        >Portfolio</a
      >
      <hr />

      <div class="social-media">
        <h2>Connect with me</h2>
        <a href="https://www.facebook.com/">Twitter</a>
        <a href="https://www.linkedIn.com/">LinkedIn</a>
        <a href="https://www.gitHub.com/">GitHub</a>
      </div>
    </div>
  </body>
</html>
