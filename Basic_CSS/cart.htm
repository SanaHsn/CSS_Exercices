<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carte de publication de blog</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
      }
      .blog-post-card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        text-align: center;
        width: 300px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .post-img {
        display: block;
        width: 100%;
        height: auto;
        border-bottom: #555 4px solid;
      }
      .post-content {
        margin-top: 10px;
        padding: 15px;
      }
      .post-title {
        font-size: 1.5em;
        margin: 10px;
        color: #403f3f;
      }
      .post-excerpt {
        font-size: 1em;
        color: #555;
        margin: 10px;
      }
      .read-more {
        display: inline-block;
        padding: 10px 15px;
        margin: 10px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }
      .read-more:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="blog-post-card">
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="Des mains tapant sue un clavier d'un ordinateur"
        class="post-img"
      />

      <div class="post-content">
        <h2 class="post-title">Learn Web Development in 2024</h2>
        <p class="post-excerpt">
          Stay ahead of the curve with the latest trends in web development. Discover what's new and exciting in 2024


        </p>
        <a
          href="https://www.freecodecamp.org/news/how-to-learn-css-in-2024/"
          class="read-more"
          target="_blank"
          >Read More</a
        >
      </div>
    </div>
  </body>
</html>
