<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .a {
            text-decoration: none;
        }
        a:link {
            color: gray;
        }
         a:visited {
            color: green;
        }
        a:hover {
            color: blue;
        }
        a:active {
            color: red;
        }
        a:focus {
            outline: 1px solid black;
        }
     
      
       



    </style>
</head>
<body>
    <h1>My To-Do List</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" name="" id="learning">
            <label for="learning">Learning CSS - FreeCodeCamp</label>
            <ul class="sub-item">
                <li><a href="https://www.freecodecamp.org/" class="sub-item-link"  target="_blank">FreeCodeCamp</a></li>
            </ul>
            
        </li>
        <li>
            <input type="checkbox" name="" id="sport">
            <label for="sport">Go to the gym </label>
            <ul class="sub-item">
                <li><a href="https://www.basic-fit.com/" class="sub-item-link"  target="_blank">Go to the gym</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" name="" id="Check_steps">
            <label for="Check_steps">Check steps</label>
            <ul class="sub-item">
                <li><a href="https://www.basic-fit.com/" class="sub-item-link"  target="_blank">Check steps</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" name="" id="Go_s">
            <label for="Go_s">Go shopping</label>
            <ul class="sub-item">
                <li><a href="https://www.delhaiz.com/" class="sub-item-link" target="_blank">Go shopping</a></li>
            </ul>

        </li>
    </ul>
</body>
</html>
