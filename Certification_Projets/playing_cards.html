<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple layout of playing cards using Flexbox">
    <title>Playing Cards</title>
    <style>
        #playing-cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2e7d32;
        }
        .card {
            display: flex;
            justify-content: space-between;
            width: 100px;
            height: 150px;
            border: 1px solid black;
            border-radius: 8px;
            font-size: 24px;
            background-color: white;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        }
        .left{
            align-self: flex-start;
            margin: 8px;
        }
        .middle{
            align-self: center;
            display: flex;
            flex-direction: column;
        }
        .right{
            align-self: flex-end;
            margin: 8px;
        }
        
    </style>
</head>
<body>
    <main id="playing-cards">
        <div class="card">
            <div class="left">♠</div>
            <div class="middle">A♠</div>
            <div class="right">♣</div>
        </div>
        <div class="card">
            <div class="left">♥</div>
            <div class="middle">K♥</div>
            <div class="right">♥</div>
        </div>
        <div class="card">
            <div class="left">♦</div>
            <div class="middle">Q♦</div>
            <div class="right">♦</div>
        </div>
        <div class="card">
            <div class="left">♣</div>
            <div class="middle">J♣</div>
            <div class="right">♣</div>
        </div>
    </main>
</body>
</html>
