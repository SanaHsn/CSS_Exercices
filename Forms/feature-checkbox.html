<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .feature-card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
            flex-wrap: wrap;
            background-color: #9b9b9b;
            padding: 40px;
            border-radius: 10px;
            box-shadow:  0 2px 6px rgba(0, 0, 0, 0.2);
            margin: auto;
        }
        .feature-card {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 150px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
        }
        .feature-card:hover {
            outline: #c9b686 2px solid;
            box-shadow: 0 0 15px rgb(241, 190, 50);
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #535353;
        }
        input[type='checkbox'] {
            appearance: none;
            width: 20px;
            height: 20px;
            cursor: pointer;
            border: 2px solid #f1be32;
            border-radius: 4px;
            background-color: white;
            transition: all 0.3s;
            vertical-align: middle;
        }
        input[type='checkbox']:checked {
            background-color: #f1be32;
            border-color: #e2a60d;
        }
        input[type="checkbox"]:checked::after {
            content: "✓";
            display: block;
            text-align: center;
            font-weight: bold;
            color: white;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <h1>Feature Selection</h1>

    <div class="feature-card-container">
        <div>
            <label for="feature1" class="feature-card">Feature 1 <input type="checkbox" class="checkbox" id="feature1"></label>
            
        </div>
        <div>
            <label for="feature2" class="feature-card">Feature 2 <input type="checkbox" class="checkbox" id="feature2"></label>
            
        </div>
        <div>
            <label for="feature3" class="feature-card">Feature 3 <input type="checkbox" class="checkbox" id="feature3"></label>
            
        </div>
        <div>
            <label for="feature4" class="feature-card">Feature 4 <input type="checkbox" class="checkbox" id="feature4"></label>
            
        </div>
        <div>
            <label for="feature5" class="feature-card">Feature 5 <input type="checkbox" class="checkbox" id="feature5"> </label>
            
        </div>
         <div>
            <label for="feature6" class="feature-card">Feature 6 <input type="checkbox" class="checkbox" id="feature6"></label>
            
        </div>
    </div>
</body>
</html>
